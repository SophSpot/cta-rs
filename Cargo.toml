[package]
name = "cta"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Client for the CTA Train Tracker and Bus Tracker APIs: arrivals, vehicle locations, routes, stops, and detours for Chicago trains and buses"
repository = "https://github.com/SophSpot/cta-rs"
readme = "README.md"
keywords = ["cta", "chicago", "transit", "train", "bus"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = [".github", "release-plz.toml"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]
serde = ["jiff/serde"]
ureq = ["dep:ureq"]

[dependencies]
jiff = "1.0.1"
reqwest = { version = "0.13.5", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = { version = "3.5.2", optional = true }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "arrivals"
required-features = ["reqwest"]

[[example]]
name = "blocking"
required-features = ["ureq"]

[[example]]
name = "locations"
required-features = ["reqwest"]

[[example]]
name = "follow"
required-features = ["reqwest"]

[[example]]
name = "custom_reqwest"
required-features = ["reqwest"]

[[example]]
name = "bus_arrivals"
required-features = ["reqwest"]

[[example]]
name = "bus_route"
required-features = ["reqwest"]

[[example]]
name = "bus_detours"
required-features = ["reqwest"]
